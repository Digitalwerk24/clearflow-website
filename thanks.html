<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – ClearFlow</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1e27;
            --bg-secondary: #1e2433;
            --border-subtle: rgba(0, 200, 255, 0.08);
            --accent: #00c8ff;
            --accent-gradient: linear-gradient(135deg, #00c8ff 0%, #1a75ff 100%);
            --text-primary: #f0f4f8;
            --text-secondary: #96a5bc;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius: 16px;
            --radius-full: 100px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        a { text-decoration: none; color: inherit; }

        .thank-you-card {
            text-align: center;
            max-width: 560px;
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: clamp(2.5rem, 6vw, 4rem);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes scaleIn {
            to { opacity: 1; transform: scale(1); }
        }

        .check-icon svg {
            width: 36px;
            height: 36px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-full);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 200, 255, 0.25);
        }

        .btn-back svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo {
            margin-top: 3rem;
            opacity: 0.4;
            transition: opacity var(--transition);
        }

        .logo:hover { opacity: 0.7; }

        .logo img {
            height: 28px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="check-icon">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1>Message Received!</h1>
        <p>Thank you for reaching out. We'll get back to you as soon as possible — usually within 24 hours.</p>
        <a href="/" class="btn-back">
            Back to Homepage
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
    </div>

    <a href="/" class="logo">
        <img src="Bilder-Website/ClearFlow-Logo.png" alt="ClearFlow">
    </a>

</body>
</html>
