<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearFlow – Hero Animation Vorschau</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1e27;
            --accent: #00c8ff;
            --accent-gradient: linear-gradient(135deg, #00c8ff 0%, #1a75ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hero-scene {
            position: relative;
            width: 500px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 60px;
        }

        /* Hintergrund-Glow */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.12) 0%, rgba(0, 200, 255, 0.03) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -55%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -55%) scale(1.08); }
        }

        /* Pulsierende Ringe */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 200, 255, 0.1);
            top: 50%;
            left: 50%;
        }

        .ring-1 {
            width: 380px; height: 380px;
            transform: translate(-50%, -55%);
            animation: ringPulse 4s ease-in-out infinite;
        }
        .ring-2 {
            width: 300px; height: 300px;
            transform: translate(-50%, -55%);
            animation: ringPulse 4s ease-in-out infinite 0.5s;
            border-color: rgba(0, 200, 255, 0.15);
        }
        .ring-3 {
            width: 220px; height: 220px;
            transform: translate(-50%, -55%);
            animation: ringPulse 4s ease-in-out infinite 1s;
            border-color: rgba(0, 200, 255, 0.2);
        }

        @keyframes ringPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Produkt-Container */
        .product-wrapper {
            position: relative;
            z-index: 10;
            animation: floatProduct 5s ease-in-out infinite;
        }

        @keyframes floatProduct {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(0.5deg); }
            50% { transform: translateY(-6px) rotate(0deg); }
            75% { transform: translateY(-14px) rotate(-0.5deg); }
        }

        .product-img {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3))
                    drop-shadow(0 0 20px rgba(0, 200, 255, 0.1));
        }

        /* Leichter Glow um das Produkt */
        .product-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 260px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(0, 200, 255, 0.08) 0%, transparent 70%);
            z-index: -1;
            border-radius: 50%;
        }

        /* ==========================================
           WASSER-ANIMATION
           ========================================== */

        .water-stream-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 200px;
            z-index: 5;
            overflow: visible;
        }

        /* Hauptstrom */
        .water-stream {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            background: linear-gradient(180deg,
                rgba(0, 200, 255, 0.5) 0%,
                rgba(0, 200, 255, 0.3) 30%,
                rgba(0, 200, 255, 0.1) 70%,
                transparent 100%);
            border-radius: 4px;
            animation: streamFlow 2s ease-in-out infinite;
        }

        @keyframes streamFlow {
            0% { height: 0; opacity: 0; top: 0; }
            10% { opacity: 0.8; }
            50% { height: 160px; opacity: 0.6; }
            80% { height: 180px; opacity: 0.2; }
            100% { height: 200px; opacity: 0; top: 0; }
        }

        /* Dünner sekundärer Strom */
        .water-stream-thin {
            position: absolute;
            top: 5px;
            left: calc(50% + 4px);
            transform: translateX(-50%);
            width: 3px;
            background: linear-gradient(180deg,
                rgba(0, 200, 255, 0.3) 0%,
                rgba(0, 200, 255, 0.15) 50%,
                transparent 100%);
            border-radius: 2px;
            animation: streamFlow 2s ease-in-out infinite 0.3s;
        }

        /* Tropfen */
        .water-drop {
            position: absolute;
            width: 6px;
            height: 8px;
            background: radial-gradient(ellipse at 30% 30%, rgba(0, 220, 255, 0.6), rgba(0, 150, 255, 0.3));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 6;
        }

        .drop-1 { left: 48%; animation: dropFall 2.5s ease-in infinite 0.2s; }
        .drop-2 { left: 52%; animation: dropFall 2.5s ease-in infinite 0.8s; }
        .drop-3 { left: 45%; animation: dropFall 3s ease-in infinite 1.5s; }
        .drop-4 { left: 55%; animation: dropFall 2.8s ease-in infinite 2s; }
        .drop-5 { left: 50%; animation: dropFall 2.2s ease-in infinite 0.5s; }

        @keyframes dropFall {
            0% { top: 60px; opacity: 0; transform: scale(0.5); }
            10% { opacity: 0.8; transform: scale(1); }
            80% { opacity: 0.4; transform: scale(0.8); }
            100% { top: 220px; opacity: 0; transform: scale(0.3); }
        }

        /* ==========================================
           GROßE SPLASH-WELLEN
           ========================================== */

        .splash-zone {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 80px;
            z-index: 4;
            overflow: visible;
        }

        /* Leuchtende Wasseroberfläche */
        .water-surface {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: radial-gradient(ellipse, rgba(0, 200, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: surfacePulse 2s ease-in-out infinite;
        }

        @keyframes surfacePulse {
            0%, 100% { width: 100px; opacity: 0.5; }
            50% { width: 140px; opacity: 0.8; }
        }

        /* Große expandierende Wellenringe */
        .splash-wave {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            border: 1.5px solid rgba(0, 200, 255, 0.45);
            border-radius: 50%;
            animation: waveExpand ease-out infinite;
        }

        .wave-1 { animation-duration: 2.5s; animation-delay: 0s; }
        .wave-2 { animation-duration: 2.5s; animation-delay: 0.5s; }
        .wave-3 { animation-duration: 2.5s; animation-delay: 1.0s; }
        .wave-4 { animation-duration: 2.5s; animation-delay: 1.5s; }
        .wave-5 { animation-duration: 2.5s; animation-delay: 2.0s; }
        .wave-6 { animation-duration: 3s; animation-delay: 0.3s; border-color: rgba(0, 200, 255, 0.25); }
        .wave-7 { animation-duration: 3s; animation-delay: 1.3s; border-color: rgba(0, 200, 255, 0.25); }

        @keyframes waveExpand {
            0% {
                width: 8px;
                height: 3px;
                opacity: 0.8;
                border-width: 1.5px;
            }
            30% {
                opacity: 0.6;
            }
            100% {
                width: 250px;
                height: 50px;
                opacity: 0;
                border-width: 0.5px;
            }
        }

        /* Spritzer nach oben beim Aufprall */
        .splash-up {
            position: absolute;
            bottom: 32px;
            width: 2px;
            height: 0;
            background: rgba(0, 200, 255, 0.5);
            border-radius: 2px;
            animation: splashUp ease-out infinite;
        }

        .splash-up-1 { left: calc(50% - 10px); animation-duration: 2.5s; animation-delay: 0.05s; }
        .splash-up-2 { left: calc(50% + 8px); animation-duration: 2.5s; animation-delay: 0.55s; }
        .splash-up-3 { left: calc(50% - 4px); animation-duration: 2.5s; animation-delay: 1.05s; }
        .splash-up-4 { left: calc(50% + 12px); animation-duration: 2.5s; animation-delay: 1.55s; }
        .splash-up-5 { left: calc(50% - 7px); animation-duration: 2.5s; animation-delay: 2.05s; }

        @keyframes splashUp {
            0% { height: 0; bottom: 32px; opacity: 0; }
            8% { height: 18px; bottom: 35px; opacity: 0.8; }
            25% { height: 10px; bottom: 48px; opacity: 0.4; }
            40% { height: 4px; bottom: 52px; opacity: 0; }
            100% { height: 0; opacity: 0; }
        }

        /* Schwebende Partikel */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 200, 255, 0.4);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-200px) translateX(20px); opacity: 0; }
        }

        .p1 { top: 70%; left: 15%; animation-duration: 5s; animation-delay: 0s; }
        .p2 { top: 80%; left: 75%; animation-duration: 6s; animation-delay: 1s; }
        .p3 { top: 60%; left: 30%; animation-duration: 4.5s; animation-delay: 2s; }
        .p4 { top: 75%; left: 60%; animation-duration: 5.5s; animation-delay: 0.5s; }
        .p5 { top: 85%; left: 45%; animation-duration: 7s; animation-delay: 1.5s; }
        .p6 { top: 65%; left: 85%; animation-duration: 4s; animation-delay: 3s; }
        .p7 { top: 90%; left: 20%; animation-duration: 6.5s; animation-delay: 2.5s; }
        .p8 { top: 55%; left: 50%; animation-duration: 5s; animation-delay: 0.8s; }

        /* Info-Hinweis */
        .info-note {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 36, 58, 0.9);
            border: 1px solid rgba(0, 200, 255, 0.2);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
            white-space: nowrap;
        }

        .info-note span {
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="hero-scene">
        <!-- Hintergrund-Glow -->
        <div class="bg-glow"></div>

        <!-- Pulsierende Ringe -->
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>

        <!-- Schwebende Partikel -->
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>
        <div class="particle p8"></div>

        <!-- Produkt -->
        <div class="product-wrapper">
            <div class="product-glow"></div>
            <img
                src="clearflow-filter.png"
                alt="ClearFlow Filter"
                class="product-img"
            >
        </div>

        <!-- Wasser-Animation unter dem Filter -->
        <div class="water-stream-container">
            <div class="water-stream"></div>
            <div class="water-stream-thin"></div>

            <!-- Fallende Tropfen -->
            <div class="water-drop drop-1"></div>
            <div class="water-drop drop-2"></div>
            <div class="water-drop drop-3"></div>
            <div class="water-drop drop-4"></div>
            <div class="water-drop drop-5"></div>
        </div>

        <!-- Splash-Zone mit großen Wellen -->
        <div class="splash-zone">
            <div class="water-surface"></div>
            <div class="splash-wave wave-1"></div>
            <div class="splash-wave wave-2"></div>
            <div class="splash-wave wave-3"></div>
            <div class="splash-wave wave-4"></div>
            <div class="splash-wave wave-5"></div>
            <div class="splash-wave wave-6"></div>
            <div class="splash-wave wave-7"></div>
            <div class="splash-up splash-up-1"></div>
            <div class="splash-up splash-up-2"></div>
            <div class="splash-up splash-up-3"></div>
            <div class="splash-up splash-up-4"></div>
            <div class="splash-up splash-up-5"></div>
        </div>
    </div>

    <div class="info-note">
        <span>Vorschau</span> – ClearFlow Hero Animation
    </div>

</body>
</html>
